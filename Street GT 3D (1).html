function mkLabel(txt){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText(txt.slice(0,16),128,44);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(6,1.5,1);s.position.y=3.4;return s}
function mkR(col){const g=mkT();g.children[0].material.color.setHex(col);return g}
if(window.claude&&claude.use)claude.use('room').then(r=>{if(!r)return;room=r;
 r.onPeers(ch=>{const ids=new Set();ch.peers.forEach(p=>{if(p.isMe)return;ids.add(p.peer);const q=p.presence;if(q.x==null)return;let o=remotes.get(p.peer);
  if(!o){const car=mkR(q.k||0xcccccc),pe=mkPerson(0xffa000);car.add(mkLabel(String(q.n||'Player')));pe.visible=false;o={car,pe,x:q.x,z:q.z,h:q.h};remotes.set(p.peer,o)}
  Object.assign(o,{tx:q.x,tz:q.z,th:q.h,w:q.w,wx:q.wx,wz:q.wz})});
  for(const [id,o] of remotes)if(!ids.has(id)){scene.remove(o.car);scene.remove(o.pe);remotes.delete(id)}
  netEl.textContent='👥 '+(ids.size+1)});
 r.on('chat',m=>addChat(String((m.data&&m.data.n)||'?').slice(0,16),String((m.data&&m.data.t)||'').slice(0,120)))}).catch(()=>{});
function netTick(t){if(room&&t-ln>80){ln=t;room.presence({x:+px.toFixed(1),z:+pz.toFixed(1),h:+h.toFixed(2),k:CARS[ci].col,n:myName,w:walk?1:0,wx:+wx.toFixed(1),wz:+wz.toFixed(1)})}}
function remoteTick(dt){const k=Math.min(1,dt*10);for(const o of remotes.values()){if(o.tx==null)continue;o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k;let dh=o.th-o.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));o.h+=dh*k;o.car.position.set(o.x,0,o.z);o.car.rotation.y=o.h;o.pe.visible=!!o.w;if(o.w)o.pe.position.set(o.wx,0,o.wz)}}
function hud(){flames.forEach(f=>{f.visible=flameT>0;f.scale.set(1+Math.random()*.5,.5+Math.random(),1+Math.random()*.5)});me.visible=walk;if(walk){me.position.set(wx,(wx>8&&wx<72&&wz>8&&wz<72)?.34:0,wz);me.rotation.y=wh}
 if((fr&7)!=0)return;const T=I18N[lang],t=Math.max(0,ms.t|0);msEl.innerHTML='🅿 <b>'+T.mis+'</b> · ⏱ '+((t/60)|0)+':'+String(t%60).padStart(2,'0')+' · 💰 $'+ms.money+' · ✔ '+ms.done+'<br><small>'+(walk?T.enter:T.exit)+'</small>'}
function minimap(){const x=mmc.getContext('2d'),C=70,sc=.38,ch=Math.cos(h),sh=Math.sin(h),P=(a,b)=>{const dx=a-px,dz=b-pz;return[C+(-dx*ch+dz*sh)*sc,C-(dx*sh+dz*ch)*sc]};
 x.clearRect(0,0,140,140);x.save();x.beginPath();x.arc(C,C,70,0,7);x.clip();x.fillStyle='rgba(20,28,38,.85)';x.fillRect(0,0,140,140);x.strokeStyle='#6b7280';x.lineWidth=4;
 for(let k=K0;k<=K1;k++){let a=P(k*B,pz-200),b=P(k*B,pz+200);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();a=P(px-200,k*B);b=P(px+200,k*B);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
 if(ms.spot){const s=P(ms.spot[0],ms.spot[1]);x.fillStyle='#00e676';x.fillRect(s[0]-4,s[1]-4,8,8)}
 x.fillStyle='#4fc3f7';for(const o of remotes.values()){const s=P(o.x,o.z);x.beginPath();x.arc(s[0],s[1],3.5,0,7);x.fill()}
 x.fillStyle='#ff5252';x.beginPath();x.moveTo(C,C-7);x.lineTo(C-5,C+5);x.lineTo(C+5,C+5);x.fill();x.restore()}
function ui(){
 const T=I18N[lang],c=CARS[ci],s=STAGES[stage],el=id=>document.getElementById(id);
 el('mb').textContent=T.menu;el('help').innerHTML=T.help;
 const bt=(txt,on,fn,st)=>{const b=document.createElement('button');b.innerHTML=txt;b.className=on?'on':'';if(st)b.style.cssText=st;b.onclick=()=>{b.blur();fn()};return b};
 const tn=el('tune');tn.innerHTML='<h3>'+T.remap+'</h3>';
 STAGES.forEach((x,i)=>tn.appendChild(bt(T.st[i],i==stage,()=>{stage=i;ui()})));
 tn.appendChild(bt(T.gb+': '+(manual?T.ma:T.au),manual,()=>{manual=!manual;ui()}));
 const sd=document.createElement('div');sd.id='stats';sd.innerHTML=T.tq+': '+Math.round(c.tq*s.m)+' Nm<br>'+T.hp+': ≈'+Math.round(c.tq*s.m*.75)+' cv<br>'+T.lim+': '+s.lim+' rpm';tn.appendChild(sd);
 const m=el('menu');m.style.display=menuOpen?'block':'none';m.innerHTML='';
 const tabs=document.createElement('div');tabs.style.cssText='display:flex;gap:6px;margin-bottom:8px';
 [['car',T.car],['set',T.set]].forEach(([k,n])=>tabs.appendChild(bt(n,tab==k,()=>{tab=k;ui()},'text-align:center')));m.appendChild(tabs);
 const bd=document.createElement('div');m.appendChild(bd);
 const row=(items)=>{const d=document.createElement('div');d.style.cssText='display:flex;gap:6px;margin:4px 0';items.forEach(i=>{i.style.textAlign='center';d.appendChild(i)});return d};
 if(tab=='car'){
  bd.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:40vh;overflow:auto';
  CARS.forEach((x,i)=>bd.appendChild(bt('<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#'+x.col.toString(16).padStart(6,'0')+'"></span> <b>'+x.n+'</b><br><small>'+Math.round(x.tq*.75)+' cv · '+x.m+' kg</small>',i==ci,()=>setCar(i))));
  const pc=document.createElement('div');pc.style.marginTop='8px';pc.append(T.paint+': ');
  [0xa3121a,0xd32f2f,0x1e88e5,0xffb300,0x43a047,0x212121,0xeeeeee,0xab47bc,0xff6f00,0x546e7a].forEach(col=>{const b=document.createElement('button');b.style.cssText='width:26px;height:26px;padding:0;display:inline-block;margin:2px;border-radius:50%;background:#'+col.toString(16).padStart(6,'0');b.onclick=()=>{b.blur();paintMat.color.setHex(col);CARS[ci].col=col};pc.appendChild(b)});m.appendChild(pc);
 }else{
  bd.style.cssText='max-height:40vh;overflow:auto';
  const sl=(lb,k)=>{const d=document.createElement('label');d.style.cssText='display:block;margin:6px 0';d.append(lb+': ');const r=document.createElement('input');r.type='range';r.min=0;r.max=100;r.value=S[k]*100;r.style.cssText='width:55%;vertical-align:middle';r.oninput=()=>{S[k]=r.value/100;audioStart()};d.appendChild(r);return d};
  bd.append(sl(T.vol,'vol'),sl(T.eng,'eng'),sl(T.fx,'fx'));
  bd.appendChild(row([bt((S.mute?'🔇 ':'🔊 ')+T.mute,S.mute,()=>{S.mute=!S.mute;ui()}),bt('🌙 '+T.night,S.night,()=>{S.night=!S.night;ui()})]));
  bd.append(T.lang+':');bd.appendChild(row([['pt','Português'],['en','English'],['es','Español']].map(([k,n])=>bt(n,lang==k,()=>{lang=k;ui()}))));
  bd.append(T.gfx+':');bd.appendChild(row([['alta',T.hi],['media',T.mid],['baixa',T.lo]].map(([k,n])=>bt(n,S.q==k,()=>{S.q=k;applyQ();ui()}))));
 }
 m.appendChild(bt(T.drive,0,toggleMenu,'margin-top:8px;text-align:center;background:#e53935'));
 if(car)applyNight();
}
function uiOld(){
 const cs=document.getElementById('cars'),ss=document.getElementById('stages');
 cs.innerHTML='';ss.innerHTML='';
 CARS.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.n;b.className=i==ci?'on':'';b.onclick=()=>{b.blur();setCar(i)};cs.appendChild(b)});
 STAGES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.className=i==stage?'on':'';b.onclick=()=>{b.blur();stage=i;ui()};ss.appendChild(b)});
 const tb=document.createElement('button');tb.textContent='Câmbio: '+(manual?'MANUAL (Q/E)':'AUTOMÁTICO');tb.className=manual?'on':'';tb.onclick=()=>{tb.blur();manual=!manual;ui()};ss.appendChild(tb);
 const mc=document.getElementById('mc');mc.innerHTML='';
 CARS.forEach((c,i)=>{const b=document.createElement('button');b.style.cssText='width:auto;flex:1 1 130px;text-align:center';b.className=i==ci?'on':'';b.innerHTML='<b>'+c.n+'</b><br><small>'+Math.round(c.tq*.75)+' cv · '+c.m+' kg</small>';b.onclick=()=>{b.blur();setCar(i)};mc.appendChild(b)});
 const pc=document.getElementById('paint');pc.innerHTML='';
 [0xd32f2f,0x1e88e5,0xffb300,0x43a047,0x212121,0xeeeeee,0xab47bc,0xff6f00,0x546e7a].forEach(col=>{const b=document.createElement('button');b.style.cssText='width:28px;height:28px;padding:0;display:inline-block;margin:2px;border-radius:50%;background:#'+col.toString(16).padStart(6,'0');b.onclick=()=>{b.blur();paintMat.color.setHex(col);CARS[ci].col=col};pc.appendChild(b)});
 document.getElementById('menu').style.display=menuOpen?'block':'none';
 const c=CARS[ci],s=STAGES[stage];
 document.getElementById('stats').innerHTML='Torque: '+Math.round(c.tq*s.m)+' Nm<br>Potência: ≈'+Math.round(c.tq*s.m*.75)+' cv<br>Limitador: '+s.lim+' rpm';
}
// velocímetro
const gx=document.getElementById('g').getContext('2d');
function gauge(kmh,r,lim){
 const x=gx,C=120;x.clearRect(0,0,240,240);
 x.fillStyle='rgba(8,12,18,.9)';x.beginPath();x.arc(C,C,116,0,7);x.fill();
 const A=f=>.75*Math.PI+1.5*Math.PI*f;
 x.lineWidth=8;x.strokeStyle='#26323f';x.beginPath();x.arc(C,C,106,A(0),A(1));x.stroke();
 const f=clamp(r/8000,0,1);x.strokeStyle=r>lim*.9?'#ff3b30':'#4fc3f7';x.beginPath();x.arc(C,C,106,A(0),A(f));x.stroke();
 x.fillStyle='#cfd8dc';x.font='11px system-ui';x.textAlign='center';x.textBaseline='middle';x.strokeStyle='#90a4ae';x.lineWidth=2;
 for(let v=0;v<=360;v+=20){const a=A(v/360),m=v%40==0;x.beginPath();x.moveTo(C+Math.cos(a)*(m?82:88),C+Math.sin(a)*(m?82:88));x.lineTo(C+Math.cos(a)*94,C+Math.sin(a)*94);x.stroke();if(m)x.fillText(v,C+Math.cos(a)*68,C+Math.sin(a)*68)}
 const a=A(clamp(kmh/360,0,1));x.strokeStyle='#ff5252';x.lineWidth=3;x.beginPath();x.moveTo(C-Math.cos(a)*10,C-Math.sin(a)*10);x.lineTo(C+Math.cos(a)*88,C+Math.sin(a)*88);x.stroke();
 x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText(Math.round(kmh),C,C+34);
 x.font='12px system-ui';x.fillStyle='#9fb3c8';x.fillText('km/h',C,C+56);
 x.font='bold 22px system-ui';x.fillStyle='#ffd54f';x.fillText(gearTxt,C,C-30);
 x.font='11px system-ui';x.fillStyle='#9fb3c8';x.fillText(Math.round(r/10)*10+' rpm',C,C-52);
}
let gearTxt='N';
// som
let ac,osc,og;
function audioStartOld(){if(ac)return;try{ac=new AudioContext();osc=ac.createOscillator();osc.type='sawtooth';og=ac.createGain();og.gain.value=.04;const f=ac.createBiquadFilter();f.frequency.value=900;osc.connect(f);f.connect(og);og.connect(ac.destination);osc.start()}catch(e){}}

function shift(d){const ng=clamp(gear+d,0,5);if(d<0){const s=Math.abs(vx*Math.sin(h)+vz*Math.cos(h));if(s/R*GEARS[ng]*FINAL*9.549>STAGES[stage].lim*1.15)return}gear=ng;shiftT=.25}
// tráfego
const TC=[0xeeeeee,0x9e9e9e,0x1565c0,0xc62828,0x2e7d32,0xf9a825,0x37474f],trf=[];
function mkT(){const g=new THREE.Group(),L=c=>new THREE.MeshLambertMaterial({color:c});
 const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.7,4.2),L(TC[(Math.random()*TC.length)|0]));b.position.y=.6;
 const c=new THREE.Mesh(new THREE.BoxGeometry(1.5,.5,2),L(0x1b2430));c.position.set(0,1.2,-.2);
 const t=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,.05),new THREE.MeshBasicMaterial({color:0xaa1111}));t.position.set(0,.7,-2.12);
 g.add(b,c,t);scene.add(g);return g}
function tpos(o){const off=o.ax?4*o.d:-4*o.d;return o.ax?[o.s,o.k*B+off]:[o.k*B+off,o.s]}
function spawnT(o){
 o.ax=Math.random()<.5?1:0;o.d=Math.random()<.5?1:-1;
 const base=o.ax?pz:px,al=o.ax?px:pz;
 o.k=clamp(Math.round(base/B)+(((Math.random()*7)|0)-3),K0,K1);
 let s=al+(Math.random()-.5)*400;if(Math.abs(s-al)<45)s+=120;
 o.s=clamp(s,K0*B,K1*B);o.vt=9+Math.random()*8;o.v=o.vt;
 o.h=o.ax?(o.d>0?Math.PI/2:-Math.PI/2):(o.d>0?0:Math.PI)}
for(let i=0;i<30;i++){const o={m:mkT()};spawnT(o);trf.push(o)}
function traffic(dt){
 for(const o of trf){if(!o.m.visible)continue;
  o.v+=(o.vt-o.v)*Math.min(1,dt*.8);o.s+=o.d*o.v*dt;
  const [x,z]=tpos(o);o.m.position.set(x,0,z);o.m.rotation.y=o.h;
  const dx=px-x,dz=pz-z,dd=Math.hypot(dx,dz);
  if(dd>300||o.s<K0*B-20||o.s>K1*B+20){spawnT(o);continue}
  if(dd<2.9){const nx=dx/dd,nz=dz/dd;px=x+nx*2.9;pz=z+nz*2.9;
   const tx=o.ax?o.d*o.v:0,tz=o.ax?0:o.d*o.v,rel=(vx-tx)*nx+(vz-tz)*nz;
   if(rel<0){vx-=1.4*rel*nx;vz-=1.4*rel*nz;o.v*=.2}}
 }}
// ===== estacionamento + missão =====
const LT=new Mg(),spots=[],ms={spot:null,t:90,hold:0,money:0,done:0};
LT.add(64,.04,64,40,.32,40,0x34373c);
for(const zc of [20,62]){for(let k=0;k<=15;k++)LT.add(.14,.02,5.6,12.3+k*3.4,.345,zc,0xf2f2f2);
 for(let k=0;k<15;k++){const x=14+k*3.4;if(Math.random()<.6){const c=mkT();c.position.set(x,.34,zc);c.rotation.y=Math.random()<.5?0:Math.PI;boxes.push([x-.95,x+.95,zc-2.1,zc+2.1,1.1])}else spots.push([x,zc])}}
LT.mesh(new THREE.MeshLambertMaterial({vertexColors:true}));
const mk2=new THREE.Mesh(new THREE.BoxGeometry(3,.06,5.2),new THREE.MeshBasicMaterial({color:0x00e676,transparent:true,opacity:.55}));scene.add(mk2);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,25,10,1,true),new THREE.MeshBasicMaterial({color:0x00e676,transparent:true,opacity:.25,side:THREE.DoubleSide}));scene.add(beam);
function newSpot(){const s=spots[(Math.random()*spots.length)|0];ms.spot=s;ms.hold=0;ms.t=60+Math.min(90,Math.hypot(s[0]-px,s[1]-pz)*.4);mk2.position.set(s[0],.37,s[1]);beam.position.set(s[0],12.5,s[1])}
function missionTick(dt){const T=I18N[lang],s=ms.spot;ms.t-=dt;const ok=Math.abs(px-s[0])<1.1&&Math.abs(pz-s[1])<1.9&&Math.hypot(vx,vz)<1&&Math.abs(Math.sin(h))<.25;ms.hold=ok?ms.hold+dt:0;
 if(ms.hold>1.2){const r=100+Math.round(ms.t*3);ms.money+=r;ms.done++;msg('✅ '+T.parked+' +$'+r);newSpot()}else if(ms.t<=0){msg('⏱ '+T.late);newSpot()}}
newSpot();
applyQ();setCar(CARS.findIndex(c=>c.st=='jetta'));
let last=performance.now();
function loop(t){
 let dt=Math.min((t-last)/1000,.05);last=t;
 if(!menuOpen){nearB=nearBoxes();if(walk)walkStep(dt);else{const n=2;for(let i=0;i<n;i++)step(dt/n);missionTick(dt);popLogic(dt)}traffic(dt)}
 cy+=(((px>8&&px<72&&pz>8&&pz<72)?.34:0)-cy)*.3;car.position.set(px,cy,pz);car.rotation.y=h;
 const vf=vx*Math.sin(h)+vz*Math.cos(h),kmh=Math.hypot(vx,vz)*3.6;
 wheelsAll.forEach(o=>o.rotation.x=wr);
 wheelsF.forEach(p=>p.rotation.y=-steer*.4/(1+Math.abs(vf)/15));
 body.rotation.z=clamp(ax*.004,-.06,.06);body.rotation.x=clamp(-spd*.003,-.05,.05);
 brakeL.color.set(dn()&&vf>.5?0xff2222:0x661111);
 const gt=vf<-.5||(dn()&&vf<.5&&!up())?'R':(Math.abs(vf)<.3&&!up()?'N':String(gear+1));gearTxt=gt;
 // câmera
 let dh=h-camH;dh=Math.atan2(Math.sin(dh),Math.cos(dh));camH+=dh*Math.min(1,dt*(camMode?20:4));
 if(menuOpen){mt+=dt*.4;cam.position.set(px+Math.sin(mt)*8,2.6,pz+Math.cos(mt)*8);cam.lookAt(px,.9,pz);cam.fov=50;body.visible=true;inter.visible=false}
 else if(walk){const s=Math.sin(wh),c=Math.cos(wh);cam.position.lerp(TV.set(wx-s*5,2.6,wz-c*5),Math.min(1,dt*8));cam.lookAt(wx,1.3,wz);cam.fov=65;body.visible=true;inter.visible=false}
 else if(camMode){const sh=Math.sin(h),ch2=Math.cos(h);cam.position.set(px-.45*ch2-.2*sh,1.12,pz+.45*sh-.2*ch2);cam.lookAt(px+sh*20,1.05,pz+ch2*20);cam.fov=78;body.visible=false;inter.visible=true;swh.rotation.z=-steer*2.2}
 else{const cd=-7.5,s=Math.sin(camH),c=Math.cos(camH);cam.position.lerp(TV.set(px+s*cd,3,pz+c*cd),Math.min(1,dt*10));cam.lookAt(px+s*5,1.2,pz+c*5);cam.fov=65+clamp(kmh/6,0,22);body.visible=true;inter.visible=false}
 cam.updateProjectionMatrix();
 if((fr&1)==0){gauge(kmh,rpm,STAGES[stage].lim);if(camMode)gTex.needsUpdate=true}
 aThr+=((up()&&!walk?1:0)-aThr)*.25;aSlip=vx*-Math.cos(h)+vz*Math.sin(h);audioUpdate();fr++;flameT-=dt;netTick(t);remoteTick(dt);hud();if((fr&3)==0)minimap();
 ren.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
